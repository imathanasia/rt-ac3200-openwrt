<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-label="RT-AC3200 router running OpenWrt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1b2b"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3f5e"/><stop offset="1" stop-color="#16233a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2738"/><stop offset="1" stop-color="#111a26"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="820" height="220" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="819" height="219" rx="20" fill="none" stroke="#263041"/>

  <!-- ===== router + wizard hat ===== -->
  <g transform="translate(58,34)">
    <!-- wifi arcs from the antennas -->
    <g fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" opacity="0.85" filter="url(#glow)">
      <path d="M96 8 a 30 30 0 0 1 34 0"/>
      <path d="M102 20 a 18 18 0 0 1 22 0"/>
      <path d="M108 32 a 8 8 0 0 1 10 0"/>
    </g>

    <!-- antennas -->
    <rect x="22" y="52" width="5" height="34" rx="2.5" fill="#3d6ea8"/>
    <rect x="120" y="52" width="5" height="34" rx="2.5" fill="#3d6ea8"/>
    <circle cx="24.5" cy="50" r="4" fill="#58a6ff"/>
    <circle cx="122.5" cy="50" r="4" fill="#58a6ff"/>

    <!-- router body -->
    <rect x="0" y="84" width="148" height="52" rx="12" fill="url(#body)" stroke="#3d6ea8" stroke-width="2"/>
    <rect x="0.5" y="84.5" width="147" height="51" rx="11.5" fill="none" stroke="url(#edge)" stroke-width="0.8" opacity="0.5"/>
    <!-- status lights -->
    <g filter="url(#glow)">
      <circle cx="20" cy="103" r="4" fill="#58a6ff"/>
      <circle cx="36" cy="103" r="4" fill="#3fb950"/>
      <circle cx="52" cy="103" r="4" fill="#d29922"/>
      <circle cx="68" cy="103" r="4" fill="#6e7681"/>
      <circle cx="84" cy="103" r="4" fill="#6e7681"/>
    </g>
    <!-- vents -->
    <g stroke="#263041" stroke-width="2">
      <path d="M20 120h108"/><path d="M20 126h108"/>
    </g>

    <!-- wizard hat sitting on the router -->
    <g transform="translate(46,-6) rotate(-8)">
      <path d="M4 74 C 10 46, 22 22, 34 2 C 40 24, 46 46, 62 74 Z" fill="url(#hat)" stroke="#3d6ea8" stroke-width="2"/>
      <path d="M6 74 C 22 66, 44 66, 60 74 C 44 82, 22 82, 6 74 Z" fill="#24334a" stroke="#3d6ea8" stroke-width="2"/>
      <circle cx="34" cy="16" r="3" fill="#d29922" filter="url(#glow)"/>
      <path d="M26 40 l3 6 6 1 -4.5 4.5 1 6.5 -5.5 -3 -5.5 3 1 -6.5 -4.5 -4.5 6 -1 z" fill="#d29922" opacity="0.9" filter="url(#glow)"/>
    </g>
  </g>

  <!-- ===== text ===== -->
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
    <text x="238" y="82" fill="#e6edf3" font-size="34" font-weight="700" letter-spacing="-0.4">ASUS RT-AC3200</text>
    <text x="238" y="110" fill="#8b98a9" font-size="15.5">OpenWrt 25.12 · Linux 6.12 · 3× BCM43602</text>

    <g transform="translate(238,128)">
      <rect width="244" height="30" rx="15" fill="none" stroke="url(#edge)" stroke-width="1.6"/>
      <text x="14" y="20" fill="#58a6ff" font-size="12.5" letter-spacing="0.9">PRE-CONFIGURED · FLASH &amp; GO</text>
    </g>
    <g transform="translate(494,128)">
      <rect width="150" height="30" rx="15" fill="none" stroke="#2c3f5e" stroke-width="1.4"/>
      <text x="14" y="20" fill="#8b98a9" font-size="12.5" letter-spacing="0.9">RECOVERY-SAFE</text>
    </g>
    <text x="238" y="188" fill="#5c6878" font-size="12">an old router, a current kernel</text>
  </g>
</svg>
